<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Central alignment group for optical balance (height = 90) -->
  <!-- Hexagon center Y is at 45 -->
  <g transform="translate(16, 8)">
    <!-- Hexagon border (74x74 box roughly, centered vertically around y=37 -> global y=45) -->
    <polygon 
      points="37,2 69,20.5 69,53.5 37,72 5,53.5 5,20.5" 
      fill="none" 
      stroke="url(#primaryGrad)" 
      stroke-width="5" 
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    
    <!-- Code bracket: < -->
    <polyline 
      points="31,27 21,37 31,47" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="4.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    
    <!-- Code bracket: > -->
    <polyline 
      points="43,27 53,37 43,47" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="4.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>
  
  <!-- Brand Wordmark: MaevioTech perfeitamente alinhado pelo meio ótico (dominant-baseline: central / middle) -->
  <text 
    x="106" 
    y="45" 
    dominant-baseline="central" 
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="34" 
    font-weight="700" 
    letter-spacing="-0.5px">
    <tspan fill="#ffffff">Maevio</tspan><tspan fill="#ffffff">Tech</tspan>
  </text>
  
</svg>
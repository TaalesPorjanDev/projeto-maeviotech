  <polyline points="142,80 160,95 142,110" fill="none" stroke="#7C6FF0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="210" y="112" font-family="'Inter', Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#1a1a2e">Maevio<tspan fill="#7C6FF0">Tech</tspan></text>
